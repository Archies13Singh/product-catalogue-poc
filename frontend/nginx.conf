server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers for the site. The backend sets its own on API responses.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Scripts and styles only from this site. Product images may come from any https host,
  # because image URLs are part of the product data and change with the data source.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # The browser calls /api on this same origin, so it never needs the backend's address.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Routing happens in the browser, so every other path serves the app.
  location / {
    try_files $uri /index.html;
  }
}
